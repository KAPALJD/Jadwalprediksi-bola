            /* Combined schedule + prediction view */
            .combined-title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 18px 0 12px;
                padding: 11px 18px;
                border-radius: 999px;
                color: #fff;
                font-size: .82rem;
                font-weight: 800;
                letter-spacing: .015em;
                background: linear-gradient(100deg, rgba(109,0,218,.92), rgba(176,38,255,.82), rgba(35,7,62,.88));
                border: 1px solid rgba(214,51,255,.5);
                box-shadow: 0 0 12px rgba(176,38,255,.42), 0 0 28px rgba(176,38,255,.16), inset 0 1px 0 rgba(255,255,255,.18);
                backdrop-filter: blur(18px);

                .combined-pred-label {

            /* Respect reduced motion */
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 0.001ms !important;
                    animation-iteration-count: 1 !important;
                    scroll-behavior: auto !important;
                }

        </style>
    </head>
    <body>
        <div class="ambient-glow" aria-hidden="true"></div>
        <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
        <div class="top-bar"></div>
        <div class="container">
            <div class="hero">
                <a href="https://nakodakapal.net/" target="_blank" rel="noopener">
                    <img src="https://i.ibb.co/23nnGsRq/BANNER.png" alt="KAPAL JUDI" loading="lazy">
                </a>
            </div>
            <div class="link-box">
                <a href="https://nakodakapal.net/" target="_blank" rel="noopener"><i class="fas fa-globe"></i> Akses Resmi KAPAL JUDI</a>
                <a href="https://shortq.org/kapalapk" target="_blank" rel="noopener"><i class="fas fa-sign-in-alt"></i> LINK LOGIN PREMIUM</a>
            </div>
            
            <div class="combined-title">
                <span><i class="fas fa-calendar-alt"></i> JADWAL &amp; PREDIKSI PERTANDINGAN</span>
                <span class="combined-pred-label"><i class="fas fa-chart-line"></i> PREDIKSI</span>
            </div>

            <!-- SUB TAB FILTER TANGGAL -->
            <div class="sub-tabs">
                <button class="sub-tab active" data-date="today"><i class="fas fa-clock"></i> HARI INI</button>
            </div>

            <div class="update-time" id="updateTime">🕐 Memuat waktu update...</div>
            
            <!-- PANEL JADWAL + PREDIKSI -->
            <div id="schedulePanel" class="panel show">
                <div id="scheduleList"><div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Memuat jadwal &amp; prediksi...</div></div>
            </div>

            <div class="service-marquee">
                <div class="service-track" id="serviceTrack"></div>
            </div>
        </div>

        <script>
            let currentFilter = 'today';
            let scheduleData = { today: [], tomorrow: [] };
            const DEFAULT_PREDICTIONS = {
                "m001": "1 : 2",
                "m002": "0 : 2",
                "m003": "2 : 1",
                "m004": "1 : 0",
                "m005": "3 : 0",

                "m093": "1 : 1",
                "m094": "1 : 0",
                "m095": "2 : 0",
                "m096": "1 : 1",
                "m097": "1 : 1",
                "m098": "2 : 1",
                "m099": "2 : 0",
                "m100": "2 : 0",
                "m101": "1 : 1",
                "m102": "2 : 1",
                "m103": "2 : 1",
                "m104": "1 : 2",
                "m105": "1 : 1",
                "m106": "1 : 0",
                "m107": "1 : 0",
                "m108": "2 : 1",
                "m109": "1 : 1",
                "m110": "2 : 1",
                "m111": "1 : 1",
                "m112": "2 : 1",
                "m113": "2 : 0"
};
            let manualPredictions = { ...DEFAULT_PREDICTIONS };
            let fixtureCache = new Map();

            const API_KEY = "f07a9e46d339ba9e2614ad810fd08639";
            const LIVE_BASE_URL = "https://livescore889.com/match/";
            const liveStatuses = ['1H', '2H', 'HT', 'ET', 'BT', 'P'];

            const serviceBanners = [
                { href: 'https://nakodakapal.net/', icon: 'fas fa-globe', title: 'WEBSITE RESMI' },
                { href: 'https://shortq.org/waaktifkapal', icon: 'fab fa-whatsapp', title: 'WHATSAPP CS' },
                { href: 'https://shortq.org/chat-kapal', icon: 'fas fa-headset', title: 'LIVE CHAT 24 JAM' }
            ];

            function escapeHTML(value) {
                return String(value ?? '').replace(/[&<>'"]/g, char => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                })[char]);
            }

            function matchKey(match) {
                return `${match.home} vs ${match.away}`;
            }

            function getPrediction(match) {
                const source = (manualPredictions && manualPredictions.predictions && typeof manualPredictions.predictions === 'object')
                    ? manualPredictions.predictions
                    : manualPredictions;

                const value =
                    source?.[match.id] ??
                    source?.[matchKey(match)] ??
                    DEFAULT_PREDICTIONS?.[match.id] ??
                    DEFAULT_PREDICTIONS?.[matchKey(match)];

                return value && String(value).trim() ? String(value).trim() : '- : -';
            }


            function getDisplayedScore(match) {
                const fixture = fixtureFor(match);
                const status = fixture?.fixture?.status?.short;
                const home = fixture?.goals?.home;
                const away = fixture?.goals?.away;

                if (liveStatuses.includes(status)) {
                    return {
                        value: `${home ?? 0} : ${away ?? 0}`,
                        state: 'live',
                        title: 'Skor LIVE pertandingan'
                    };
                }

                if (['FT', 'AET', 'PEN'].includes(status)) {
                    if (home !== null && home !== undefined && away !== null && away !== undefined) {
                        return {
                            value: `${home} : ${away}`,
                            state: 'final',
                            title: status === 'PEN'
                                ? 'Hasil akhir pertandingan (setelah adu penalti)'
                                : 'Hasil akhir pertandingan'
                        };
                    }
                }

                return {
                    value: getPrediction(match),
                    state: 'prediction',
                    title: 'Prediksi skor sebelum pertandingan'
                };
            }

            function normalizeTeam(name) {
                return String(name || '')
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/\[[^\]]*\]/g, ' ')
                    .replace(/&/g, ' and ')
                    .replace(/[^a-z0-9]+/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function teamSignature(name) {
                const stop = new Set(['fc','cf','fk','sc','ca','cd','ec','ac','afc','club','the']);
                return normalizeTeam(name).split(' ').filter(x => x && !stop.has(x)).join(' ');
            }

            function sameTeam(a, b) {
                const na = normalizeTeam(a), nb = normalizeTeam(b);
                if (!na || !nb) return false;
                if (na === nb) return true;
                const sa = teamSignature(a), sb = teamSignature(b);
                if (sa && sb && sa === sb) return true;
                return Math.min(sa.length, sb.length) >= 8 && (sa.includes(sb) || sb.includes(sa));
            }

            function getJakartaDate(offsetDays = 0) {
                const now = new Date();
                const shifted = new Date(now.getTime() + offsetDays * 86400000);
                const parts = new Intl.DateTimeFormat('en-GB', {
                    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit'
                }).formatToParts(shifted);
                const obj = Object.fromEntries(parts.map(p => [p.type, p.value]));
                return `${obj.year}-${obj.month}-${obj.day}`;
            }

            async function loadJSON(file, fallback) {
                try {
                    const response = await fetch(`${file}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`${file} HTTP ${response.status}`);
                    return await response.json();
                } catch (error) {
                    console.warn(`Gagal memuat ${file}:`, error);
                    return fallback;
                }
            }

            function renderServiceBanner() {
                let html = '';
                for (let i = 0; i < 3; i++) {
                    serviceBanners.forEach(s => {
                        html += `<a href="${escapeHTML(s.href)}" target="_blank" rel="noopener" class="service-item"><i class="${escapeHTML(s.icon)}"></i><span>${escapeHTML(s.title)}</span></a>`;
                    });
                }
                document.getElementById('serviceTrack').innerHTML = html;
            }

            function initSparkles() {
                const layer = document.getElementById('sparkleLayer');
                if (!layer || layer.children.length) return;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const sparkleCount = reduceMotion ? 10 : 28;
                const randomBetween = (min, max) => Math.random() * (max - min) + min;

                function styleSparkle(el, initial = false) {
                    const size = randomBetween(2, 6);
                    const duration = randomBetween(2.8, 6.2);
                    const delay = initial ? randomBetween(-duration, 0) : 0;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.style.left = `${randomBetween(1, 99)}%`;
                    el.style.top = `${randomBetween(1, 99)}%`;
                    el.style.animationDuration = `${duration}s`;
                    el.style.animationDelay = `${delay}s`;
                    el.classList.toggle('big', size > 4.3 && Math.random() > 0.5);
                }

                for (let i = 0; i < sparkleCount; i++) {
                    const sparkle = document.createElement('span');
                    sparkle.className = 'sparkle';
                    styleSparkle(sparkle, true);
                    sparkle.addEventListener('animationiteration', () => styleSparkle(sparkle, false));
                    layer.appendChild(sparkle);
                }

                if (!reduceMotion) {
                    setInterval(() => {
                        const extra = document.createElement('span');
                        extra.className = 'sparkle big';
                        styleSparkle(extra, false);
                        extra.style.animationDuration = `${randomBetween(2.2, 3.8)}s`;
                        layer.appendChild(extra);
                        setTimeout(() => extra.remove(), 4200);
                    }, 1200);
                }
            }

            function fixtureFor(match) {
                return fixtureCache.get(match.id) || null;
            }

            function buildIndicator(match) {
                const fixture = fixtureFor(match);
                if (!fixture) return '';
                const status = fixture.fixture?.status?.short;

                if (liveStatuses.includes(status)) {
                    const elapsed = fixture.fixture.status.elapsed;
                    const liveText = status === 'HT' ? 'HT' : (elapsed ? `LIVE ${elapsed}'` : 'LIVE');
                    const url = `${LIVE_BASE_URL}${encodeURIComponent(fixture.fixture.id)}`;
                    return `<a href="${url}" target="_blank" rel="noopener" class="live-btn" title="Buka live pertandingan">${escapeHTML(liveText)}</a>`;
                }
                if (['FT', 'AET', 'PEN'].includes(status)) return '<span class="status-badge">FT</span>';
                if (['CANC', 'PSTP', 'ABD'].includes(status)) return '<span class="status-badge">TUNDA</span>';
                return '';
            }

            function buildRow(match) {
                const indicator = buildIndicator(match);
                const scoreInfo = getDisplayedScore(match);
                const score = escapeHTML(scoreInfo.value);
                const scoreClass =
                    scoreInfo.state === 'live' ? 'score live-score' :
                    scoreInfo.state === 'final' ? 'score final-score' :
                    'score';
                const scoreTitle = escapeHTML(scoreInfo.title);
                const time = escapeHTML(match.time) + ' WIB';
                const teams = `${escapeHTML(match.home)} vs ${escapeHTML(match.away)}`;

                return `
                    <div class="item">
                        <span class="time">${time}</span>
                        <span class="teams">${teams}</span>
                        <div class="action-container">
                            ${indicator}
                            <span class="${scoreClass}" title="${scoreTitle}">${score}</span>
                        </div>
                    </div>`;
            }

            function renderMatches() {
                const matches = Array.isArray(scheduleData[currentFilter]) ? scheduleData[currentFilter] : [];
                if (!matches.length) {
                    const msg = currentFilter === 'today' ? 'Belum ada jadwal hari ini.' : 'Jadwal besok belum diisi.';
                    document.getElementById('scheduleList').innerHTML = `<div class="loading-text">${msg}</div>`;
                    return;
                }

                const liveMatches = matches.filter(m => {
                    const f = fixtureFor(m);
                    return f && liveStatuses.includes(f.fixture?.status?.short);
                });
                const liveIds = new Set(liveMatches.map(m => m.id));
                const regular = matches.filter(m => !liveIds.has(m.id));

                let html = '';

                if (liveMatches.length) {
                    html += '<div class="item header-item"><span class="teams" style="color:#ff4d4d;font-weight:700;">🔥 PERTANDINGAN SEDANG LIVE</span><span class="score" style="visibility:hidden;">0 : 0</span></div>';
                    liveMatches.forEach(m => {
                        html += buildRow(m);
                    });
                }

                const grouped = new Map();
                regular.forEach(m => {
                    if (!grouped.has(m.league)) grouped.set(m.league, []);
                    grouped.get(m.league).push(m);
                });

                grouped.forEach((items, league) => {
                    html += `<div class="item header-item"><span class="teams" style="color:#e0b3ff;font-weight:700;">${escapeHTML(league)}</span><span class="score" style="visibility:hidden;">0 : 0</span></div>`;
                    items.forEach(m => {
                        html += buildRow(m);
                    });
                });

                document.getElementById('scheduleList').innerHTML = html;
            }

            async function fetchApiDate(dateStr) {
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${dateStr}&timezone=Asia/Jakarta&_=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'x-rapidapi-key': API_KEY, 'x-rapidapi-host': 'v3.football.api-sports.io' }
                });
                if (!response.ok) throw new Error(`API ${response.status}`);
                const data = await response.json();
                return Array.isArray(data?.response) ? data.response : [];
            }

            function mapFixturesToSchedule(fixtures) {
                fixtureCache.clear();
                const allMatches = [
                    ...(Array.isArray(scheduleData.today) ? scheduleData.today : []),
                    ...(Array.isArray(scheduleData.tomorrow) ? scheduleData.tomorrow : [])
                ];

                allMatches.forEach(match => {
                    if (match.fixtureId) {
                        const direct = fixtures.find(f => String(f.fixture?.id) === String(match.fixtureId));
                        if (direct) {
                            fixtureCache.set(match.id, direct);
                            return;
                        }
                    }
                    const found = fixtures.find(f =>
                        sameTeam(match.home, f.teams?.home?.name) && sameTeam(match.away, f.teams?.away?.name)
                    );
                    if (found) fixtureCache.set(match.id, found);
                });
            }

            async function refreshLiveStatus() {
                try {
                    // Ambil dua tanggal sekaligus karena daftar "hari ini" dari sumber dapat melewati tengah malam WIB.
                    const baseOffset = currentFilter === 'tomorrow' ? 1 : 0;
                    const dates = [getJakartaDate(baseOffset), getJakartaDate(baseOffset + 1)];
                    const results = await Promise.all(dates.map(fetchApiDate));
                    mapFixturesToSchedule(results.flat());
                    renderMatches();
                    document.getElementById('updateTime').innerText = `🕐 Jadwal manual • status live update ${new Date().toLocaleTimeString('id-ID')}`;
                } catch (error) {
                    console.warn('Status live tidak dapat diperbarui:', error);
                    document.getElementById('updateTime').innerText = `🕐 Jadwal manual • ${new Date().toLocaleTimeString('id-ID')}`;
                }
            }

            function initTabs() {
                document.querySelectorAll('.sub-tab').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.date;
                        renderMatches();
                        await refreshLiveStatus();
                    });
                });
            }

            async function initPage() {
                renderServiceBanner();
                initSparkles();
                initTabs();

                const [initialSchedule, initialPredictions] = await Promise.all([
                    loadJSON('schedule.json', { today: [], tomorrow: [] }),
                    loadJSON('predictions.json', null)
                ]);

                scheduleData = initialSchedule;
                manualPredictions = (initialPredictions && typeof initialPredictions === 'object' && !Array.isArray(initialPredictions))
                    ? { ...DEFAULT_PREDICTIONS, ...initialPredictions }
                    : { ...DEFAULT_PREDICTIONS };

                renderMatches();
                await refreshLiveStatus();
            }

            async function refreshLocalData() {
                const [latestSchedule, latestPredictions] = await Promise.all([
                    loadJSON('schedule.json', scheduleData),
                    loadJSON('predictions.json', null)
                ]);

                scheduleData = latestSchedule;
                manualPredictions = (latestPredictions && typeof latestPredictions === 'object' && !Array.isArray(latestPredictions))
                    ? { ...DEFAULT_PREDICTIONS, ...latestPredictions }
                    : { ...DEFAULT_PREDICTIONS };
                renderMatches();
            }

            initPage();

            // Jadwal + prediksi lokal: cek versi terbaru otomatis setiap 15 detik.
            // loadJSON sudah memakai cache:'no-store' + timestamp, jadi browser tidak memakai JSON lama.
            setInterval(refreshLocalData, 15000);

            // Skor/status API: saat ada pertandingan LIVE cek tiap 30 detik,
            // di luar LIVE cek tiap 2 menit supaya request API tetap lebih hemat.
            function hasLiveMatch() {
                return [...fixtureCache.values()].some(f =>
                    liveStatuses.includes(f?.fixture?.status?.short)
                );
            }

            async function liveScoreLoop() {
                await refreshLiveStatus();
                const nextDelay = hasLiveMatch() ? 30000 : 120000;
                setTimeout(liveScoreLoop, nextDelay);
            }

            setTimeout(liveScoreLoop, 30000);

            // Saat pengguna kembali ke tab/browser, langsung cek data terbaru.
            window.addEventListener('focus', () => {
                refreshLocalData();
                refreshLiveStatus();
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    refreshLocalData();
                    refreshLiveStatus();
                }
            });
            window.addEventListener('pageshow', () => {
                refreshLocalData();
                refreshLiveStatus();
            });
        </script>
