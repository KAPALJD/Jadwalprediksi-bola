            const directLiveUrls = {
                // 1490435: 'https://livescore889.com/match/1490435'
            };

            function getLiveUrl(fixtureId) {
                if (directLiveUrls[fixtureId]) return directLiveUrls[fixtureId];
                return `https://livescore889.com/match/${encodeURIComponent(fixtureId)}`;
            }

            const serviceBanners = [
                { href: 'https://nakodakapal.net/', icon: 'fas fa-globe', title: 'WEBSITE RESMI' },
                { href: 'https://shortq.org/waaktifkapal', icon: 'fab fa-whatsapp', title: 'WHATSAPP CS' },
                { href: 'https://shortq.org/chat-kapal', icon: 'fas fa-headset', title: 'LIVE CHAT 24 JAM' }
            ];
            let htmlService = '';
            for(let i=0; i<3; i++) {
                serviceBanners.forEach(s => { htmlService += `<a href="${s.href}" target="_blank" class="service-item"><i class="${s.icon}"></i><span>${s.title}</span></a>`; });
            }
            document.getElementById('serviceTrack').innerHTML = htmlService;

            // Switch Utama Tab (Jadwal / Prediksi)
            document.querySelectorAll('.tab').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('schedulePanel').classList.toggle('show', btn.dataset.tab === 'schedule');
                    document.getElementById('predictionPanel').classList.toggle('show', btn.dataset.tab === 'prediction');
                };
            });

            // Switch Sub Tab (Hari Ini / Besok)
            document.querySelectorAll('.sub-tab').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.date;
        

            function initSparkles() {
                const layer = document.getElementById('sparkleLayer');
                if (!layer) return;

                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const sparkleCount = reduceMotion ? 10 : 28;
                const randomBetween = (min, max) => Math.random() * (max - min) + min;

                function styleSparkle(el, initial = false) {
                    const size = randomBetween(2, 6);
                    const duration = randomBetween(2.8, 6.2);
                    const delay = initial ? randomBetween(-duration, 0) : 0;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.style.left = `${randomBetween(1, 99)}%`;
                    el.style.top = `${randomBetween(1, 99)}%`;
                    el.style.animationDuration = `${duration}s`;
                    el.style.animationDelay = `${delay}s`;
                    el.classList.toggle('big', size > 4.3 && Math.random() > 0.5);
                }

                for (let i = 0; i < sparkleCount; i++) {
                    const sparkle = document.createElement('span');
                    sparkle.className = 'sparkle';
                    styleSparkle(sparkle, true);
                    sparkle.addEventListener('animationiteration', () => styleSparkle(sparkle, false));
                    layer.appendChild(sparkle);
                }

                if (!reduceMotion) {
                    setInterval(() => {
                        const extra = document.createElement('span');
                        extra.className = 'sparkle big';
                        styleSparkle(extra, false);
                        extra.style.animationDuration = `${randomBetween(2.2, 3.8)}s`;
                        layer.appendChild(extra);
                        setTimeout(() => extra.remove(), 4200);
                    }, 1200);
                }
            }

            initSparkles();

            fetchFootballData();
                };
            });

            function getPredictedScore(fixtureId) {
                return manualPredictions[String(fixtureId)] || '- : -';
            }

            async function loadManualPredictions() {
                try {
                    const response = await fetch(`predictions.json?t=${Date.now()}`, { cache: 'no-store' });
                    if (!response.ok) throw new Error('predictions.json tidak ditemukan');
                    manualPredictions = await response.json();
                } catch (error) {
                    console.warn('Gagal memuat prediksi manual:', error);
                    manualPredictions = {};
                }
            }

            function fetchFootballData() {
                const apiKey = "f07a9e46d339ba9e2614ad810fd08639";
                const targetDate = new Date();
                
                if (currentFilter === 'tomorrow') {
                    targetDate.setDate(targetDate.getDate() + 1);
                }

                // Format Tanggal Ke YYYY-MM-DD
                const dateStr = targetDate.toISOString().split('T')[0];

                document.querySelectorAll('.loading-text').forEach(e => e.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Memuat data...`);

                fetch(`https://v3.football.api-sports.io/fixtures?date=${dateStr}&timezone=Asia/Jakarta`, {
                    method: "GET", headers: { "x-rapidapi-key": apiKey, "x-rapidapi-host": "v3.football.api-sports.io" }
                })
                .then(res => res.json())
                .then(data => {
                    if (data?.response?.length > 0) renderMatches(data.response);
                    else {
                        const emptyMsg = currentFilter === 'today' ? "Tidak ada pertandingan hari ini." : "Belum ada jadwal untuk besok.";
                        document.getElementById('scheduleList').innerHTML = `<div class="loading-text">${emptyMsg}</div>`;
                        document.getElementById('predictionList').innerHTML = `<div class="loading-text">${emptyMsg}</div>`;
                    }
                    document.getElementById('updateTime').innerText = `🕐 Update: ${new Date().toLocaleTimeString('id-ID')}`;
                }).catch(() => {
                    document.querySelectorAll('.loading-text').forEach(e => e.innerHTML = "Gagal memuat data API.");
                });
            }

            function renderMatches(fixtures) {
                const liveStatuses = ['1H', '2H', 'HT', 'ET', 'BT', 'P'];
                
                // Pisahkan pertandingan LIVE dari yang lainnya
                const liveFixtures = fixtures.filter(item => liveStatuses.includes(item.fixture.status.short));
                const regularFixtures = fixtures.filter(item => !liveStatuses.includes(item.fixture.status.short));

                let scheduleHtml = '', predictionHtml = '';

                // Helper function untuk generate baris HTML
                const buildRow = (item) => {
                    const status = item.fixture.status.short;
                    const matchDate = new Date(item.fixture.date);
                    let timeStr = matchDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
                    
                    let liveIndicator = '';
                    if (liveStatuses.includes(status)) {
                        let elapsed = item.fixture.status.elapsed;
                        let liveText = elapsed ? `LIVE ${elapsed}'` : 'LIVE';
                        if (status === 'HT') liveText = 'HT';
                        liveIndicator = `<a href="${getLiveUrl(item.fixture.id)}" target="_blank" rel="noopener" class="live-btn" title="Buka live pertandingan">${liveText}</a>`;
                    } else if (['FT', 'AET', 'PEN'].includes(status)) {
                        liveIndicator = `<span class="status-badge">FT</span>`;
                    } else if (['CANC', 'PSTP', 'ABD'].includes(status)) {
                        liveIndicator = `<span class="status-badge">TUNDA</span>`;
                    }

                    const homeTeam = item.teams.home.name;
                    const awayTeam = item.teams.away.name;
                    const scoreDisplay = (item.goals.home !== null) ? `${item.goals.home} : ${item.goals.away}` : getPredictedScore(item.fixture.id);

                    const schRow = `
                        <div class="item">
                            <span class="time">${timeStr}</span>
                            <span class="teams">${homeTeam} vs ${awayTeam}</span>
                            <div class="action-container">${liveIndicator}</div>
                        </div>`;

                    const predRow = `
                        <div class="item">
                            <span class="time">${timeStr}</span>
                            <span class="teams">${homeTeam} vs ${awayTeam}</span>
                            <div class="action-container">
                                ${liveIndicator}
                                <span class="score">${scoreDisplay}</span>
                            </div>
                        </div>`;

                    return { schRow, predRow };
                };

                // 1. TAMPILKAN MATCH LIVE DI PADA URUTAN TERATAS
                if (liveFixtures.length > 0) {
                    scheduleHtml += `<div class="item header-item"><span class="teams" style="color:#ff4d4d;font-weight:700;">🔥 PERTANDINGAN SEDANG LIVE</span></div>`;
                    predictionHtml += `<div class="item header-item"><span class="teams" style="color:#ff4d4d;font-weight:700;">🔥 PERTANDINGAN SEDANG LIVE</span></div>`;
                    
                    liveFixtures.forEach(item => {
                        const row = buildRow(item);
                        scheduleHtml += row.schRow;
                        predictionHtml += row.predRow;
                    });
                }

                // 2. KELOMPOKKAN SISANYA PER LIGA
                let grouped = {};
                regularFixtures.forEach(item => {
                    const leagueName = `${item.league.country.toUpperCase()} - ${item.league.name.toUpperCase()}`;
                    if (!grouped[leagueName]) grouped[leagueName] = [];
                    grouped[leagueName].push(item);
                });

                for (const league in grouped) {
                    scheduleHtml += `<div class="item header-item"><span class="teams" style="color:#e0b3ff;font-weight:700;">📌 ${league}</span></div>`;
                    predictionHtml += `<div class="item header-item"><span class="teams" style="color:#e0b3ff;font-weight:700;">📌 ${league}</span></div>`;

                    grouped[league].forEach(item => {
                        const row = buildRow(item);
                        scheduleHtml += row.schRow;
                        predictionHtml += row.predRow;
                    });
                }

                document.getElementById('scheduleList').innerHTML = scheduleHtml;
                document.getElementById('predictionList').innerHTML = predictionHtml;
            }

            async function initPage() {
                await loadManualPredictions();
                fetchFootballData();
            }

            initPage();
            setInterval(async () => {
                await loadManualPredictions();
                fetchFootballData();
            }, 120000); // Auto update 2 menit
        </script>
    </body>
</html>
